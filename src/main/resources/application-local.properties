# Optional profile for running the app without Docker/MySQL: a file-based H2
# database instead of the compose.yml MySQL instance. Data persists across
# restarts in ./data/budgeting.mv.db. Activate with:
#   ./gradlew bootRun --args='--spring.profiles.active=local'
# or SPRING_PROFILES_ACTIVE=local before bootRun.
spring.datasource.url=jdbc:h2:file:./data/budgeting;AUTO_SERVER=TRUE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# No MySQL container to manage in this profile: don't let Spring Boot try to
# run `docker compose up` on startup (also handy on machines without Docker).
spring.docker.compose.enabled=false
