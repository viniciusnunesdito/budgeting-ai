# Profile used by @SpringBootTest classes: an in-memory H2 database so the
# main flows (create/list/summary) can be tested without a running MySQL
# instance, and a dummy OpenAI key so the context loads without hitting the
# network for tests that don't exercise the AI layer.
spring.datasource.url=jdbc:h2:mem:budgeting;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

spring.ai.openai.api-key=test-key
spring.autoconfigure.exclude=org.springframework.boot.docker.compose.autoconfigure.DockerComposeAutoConfiguration
